<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 할 일</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>오늘의 할 일</h1>
      <p class="today-date" id="todayDate"></p>
    </header>

    <form class="input-area" id="taskForm">
      <label for="taskInput" class="visually-hidden">할 일 내용</label>
      <input
        type="text"
        id="taskInput"
        name="taskInput"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
      >

      <label for="categorySelect" class="visually-hidden">카테고리 선택</label>
      <select id="categorySelect" name="categorySelect" aria-label="카테고리 선택">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>

      <button type="submit" id="addBtn" aria-label="할 일 추가">추가</button>
    </form>
    <p class="input-error" id="inputError" role="alert" aria-live="polite"></p>

    <nav class="filter-area" id="filterArea" aria-label="카테고리 필터">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
        전체 <span class="filter-count" id="count-all">0</span>
      </button>
      <button type="button" class="filter-btn" data-filter="work" aria-pressed="false">
        업무 <span class="filter-count" id="count-work">0</span>
      </button>
      <button type="button" class="filter-btn" data-filter="personal" aria-pressed="false">
        개인 <span class="filter-count" id="count-personal">0</span>
      </button>
      <button type="button" class="filter-btn" data-filter="study" aria-pressed="false">
        공부 <span class="filter-count" id="count-study">0</span>
      </button>
    </nav>

    <main class="list-area">
      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <p class="empty-state" id="emptyState" hidden>할 일이 없습니다</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
